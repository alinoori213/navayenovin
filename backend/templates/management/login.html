<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل مدیریت</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background-color: white;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h2 {
            color: #2c3e50;
        }
        .btn-login {
            width: 100%;
            padding: 0.8rem;
            background-color: #2c3e50;
            border: none;
        }
        .btn-login:hover {
            background-color: #34495e;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h2>نوای نوین</h2>
            <p class="text-muted">ورود به پنل مدیریت</p>
        </div>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">نام کاربری</label>
                <input type="text" name="username" class="form-control" id="id_username" required>
            </div>
            <div class="mb-4">
                <label for="id_password" class="form-label">رمز عبور</label>
                <input type="password" name="password" class="form-control" id="id_password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login">ورود</button>
        </form>
    </div>
</body>
</html>
