<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ survey.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Tahoma, Arial, sans-serif;
        }
        .survey-container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .survey-header {
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .question-box {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-right: 4px solid #0d6efd;
        }
        .form-check-label {
            cursor: pointer;
            width: 100%;
            padding: 5px;
        }
        .form-check:hover {
            background-color: #e9ecef;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="survey-container">
        <div class="survey-header text-center">
            <h1 class="mb-3 text-primary">{{ survey.title }}</h1>
            {% if survey.description %}
            <p class="text-muted lead">{{ survey.description }}</p>
            {% endif %}
        </div>

        <form method="post">
            {% csrf_token %}
            
            {% for question in survey.questions.all %}
            <div class="question-box">
                <h5 class="mb-3 fw-bold">{{ forloop.counter }}. {{ question.text }}</h5>
                
                {% for choice in question.choices.all %}
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="question_{{ question.id }}" id="choice_{{ choice.id }}" value="{{ choice.id }}" required>
                    <label class="form-check-label" for="choice_{{ choice.id }}">
                        {{ choice.text }}
                    </label>
                </div>
                {% endfor %}
            </div>
            {% endfor %}

            <div class="text-center mt-5">
                <button type="submit" class="btn btn-primary btn-lg px-5">ثبت نظرسنجی</button>
            </div>
        </form>
    </div>
    
    <div class="text-center text-muted mt-3 mb-5">
        <small>قدرت گرفته از سیستم مدیریت نوای نوین</small>
    </div>
</div>

</body>
</html>
