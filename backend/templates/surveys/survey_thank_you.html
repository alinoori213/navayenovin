<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشکر از شما</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Tahoma, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .thank-you-card {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .icon-box {
            width: 80px;
            height: 80px;
            background-color: #d1e7dd;
            color: #198754;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 40px;
        }
    </style>
</head>
<body>

<div class="thank-you-card">
    <div class="icon-box">✓</div>
    <h2 class="mb-4 text-success">با تشکر!</h2>
    <p class="lead mb-4">پاسخ شما با موفقیت ثبت شد.</p>
    <p class="text-muted">از مشارکت شما در این نظرسنجی سپاسگزاریم.</p>
</div>

</body>
</html>
