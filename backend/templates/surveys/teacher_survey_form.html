{% extends 'management/base.html' %}

{% block title %}ایجاد نظرسنجی اساتید{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h6 class="m-0 font-weight-bold text-success">ایجاد نظرسنجی استاد جدید</h6>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    
                    <button type="submit" class="btn btn-success btn-block">
                        <i class="fas fa-save"></i> ذخیره و افزودن سوالات
                    </button>
                    <a href="{% url 'surveys:survey_list' %}" class="btn btn-secondary btn-block mt-2">
                        بازگشت به لیست
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
